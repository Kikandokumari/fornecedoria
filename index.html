<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FornecedorIA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  margin: 0;
  padding: 20px;
  color: #111;
}

.container {
  max-width: 760px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 36px;
}

.subtitulo {
  text-align: center;
  color: #555;
  margin: 10px 0 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #15803d;
}

#resultado {
  margin-top: 22px;
}

.card {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}

.card h2 {
  margin: 0 0 12px;
  font-size: 21px;
}

.info {
  margin: 7px 0;
  font-size: 15px;
  color: #333;
}

.info strong {
  color: #111;
}

.acoes {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn {
  flex: 1;
  text-align: center;
  padding: 11px;
  border-radius: 9px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
  border: none;
  cursor: pointer;
}

.btn-whatsapp {
  background: #16a34a;
  color: white;
}

.btn-secundario {
  background: #e5e7eb;
  color: #111;
}

.detalhes {
  display: none;
  margin-top: 12px;
  padding: 12px;
  background: white;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
}

.comparador {
  display: none;
  margin-top: 26px;
  padding: 16px;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
}

.comparador h2 {
  margin: 0 0 6px;
  font-size: 20px;
}

.comparador p {
  margin: 0 0 14px;
  color: #666;
  font-size: 14px;
}

.tabela {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.tabela th,
.tabela td {
  border: 1px solid #e5e7eb;
  padding: 9px;
  text-align: left;
  vertical-align: top;
}

.tabela th {
  background: #f3f4f6;
}

.loading {
  background: #f0fdf4;
  padding: 16px;
  border-radius: 12px;
}

.erro {
  background: #fee2e2;
  color: #991b1b;
  padding: 16px;
  border-radius: 12px;
}

.aviso {
  margin-top: 18px;
  color: #666;
  font-size: 13px;
  text-align: center;
}

@media (max-width: 600px) {
  body {
    padding: 14px;
  }

  .container {
    padding: 20px;
  }

  .acoes {
    flex-direction: column;
  }

  .tabela {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>FornecedorIA</h1>
  <p class="subtitulo">Encontre fornecedores para seu negócio usando IA.</p>

  <input id="produto" placeholder="Ex: fornecedor de água e gás">
  <input id="cidade" placeholder="Ex: Uberlândia">

  <button onclick="buscar()">Buscar fornecedores</button>

  <div id="resultado"></div>

  <div id="comparador" class="comparador">
    <h2>Comparar valores e benefícios</h2>
    <p>Use esta tabela para comparar os fornecedores antes de chamar.</p>

    <table class="tabela">
      <thead>
        <tr>
          <th>Empresa</th>
          <th>Produtos</th>
          <th>Benefícios</th>
          <th>Faixa de preço</th>
        </tr>
      </thead>
      <tbody id="corpoTabela"></tbody>
    </table>
  </div>

  <p class="aviso">
    Confirme preços, entrega e disponibilidade diretamente com o fornecedor.
  </p>
</div>

<script>
async function buscar() {
  const produto = document.getElementById("produto").value.trim();
  const cidade = document.getElementById("cidade").value.trim();
  const resultado = document.getElementById("resultado");
  const comparador = document.getElementById("comparador");

  if (!produto || !cidade) {
    alert("Preencha o produto e a cidade.");
    return;
  }

  resultado.innerHTML = `<div class="loading">Pesquisando fornecedores...</div>`;
  comparador.style.display = "none";

  try {
    const resposta = await fetch("/api/buscar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        busca: `${produto} em ${cidade}`
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      resultado.innerHTML = `<div class="erro">${dados.erro || "Erro ao buscar fornecedores."}</div>`;
      return;
    }

    const fornecedores = dados.fornecedores || [];

    if (!fornecedores.length) {
      resultado.innerHTML = `<div class="erro">Nenhum fornecedor encontrado.</div>`;
      return;
    }

    mostrarFornecedores(fornecedores);
    montarTabela(fornecedores);

  } catch (erro) {
    resultado.innerHTML = `<div class="erro">Erro ao buscar fornecedores. Tente novamente.</div>`;
  }
}

function mostrarFornecedores(lista) {
  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "";

  lista.forEach((f, index) => {
    const temWhatsapp = f.whatsappLink && f.whatsapp !== "não encontrado";
    const siteValido = f.site && f.site !== "não encontrado";

    const whatsappUrl = temWhatsapp
      ? `https://wa.me/${f.whatsappLink}?text=${encodeURIComponent("Olá, encontrei sua empresa pelo FornecedorIA. Gostaria de saber valores e condições de fornecimento.")}`
      : "";

    const siteUrl = siteValido ? normalizarSite(f.site) : "";

    resultado.innerHTML += `
      <div class="card">
        <h2>${f.empresa || "Empresa não encontrada"}</h2>

        <p class="info"><strong>Cidade:</strong> ${f.cidade || "não encontrado"}</p>
        <p class="info"><strong>Telefone:</strong> ${f.telefone || "não encontrado"}</p>
        <p class="info"><strong>WhatsApp:</strong> ${f.whatsapp || "não encontrado"}</p>
        <p class="info"><strong>Site:</strong> ${
          siteValido ? `<a href="${siteUrl}" target="_blank">${f.site}</a>` : "não encontrado"
        }</p>
        <p class="info"><strong>Produtos:</strong> ${f.produtos || "não encontrado"}</p>
        <p class="info"><strong>Faixa de preço:</strong> ${f.faixaPreco || "consultar fornecedor"}</p>

        <div class="acoes">
          ${
            temWhatsapp
              ? `<a class="btn btn-whatsapp" href="${whatsappUrl}" target="_blank">WhatsApp</a>`
              : `<button class="btn btn-secundario" onclick="copiarTexto('${limparTexto(f.telefone)}')">Copiar telefone</button>`
          }

          <button class="btn btn-secundario" onclick="toggleDetalhes(${index})">Saiba mais</button>
        </div>

        <div id="detalhes-${index}" class="detalhes">
          <p class="info"><strong>Benefícios:</strong> ${f.beneficios || "consultar fornecedor"}</p>
        </div>
      </div>
    `;
  });
}

function montarTabela(lista) {
  const comparador = document.getElementById("comparador");
  const corpoTabela = document.getElementById("corpoTabela");

  corpoTabela.innerHTML = "";

  lista.forEach(f => {
    corpoTabela.innerHTML += `
      <tr>
        <td>${f.empresa || "não encontrado"}</td>
        <td>${f.produtos || "não encontrado"}</td>
        <td>${f.beneficios || "consultar fornecedor"}</td>
        <td>${f.faixaPreco || "consultar fornecedor"}</td>
      </tr>
    `;
  });

  comparador.style.display = "block";
}

function toggleDetalhes(index) {
  const detalhes = document.getElementById(`detalhes-${index}`);
  detalhes.style.display = detalhes.style.display === "block" ? "none" : "block";
}

function normalizarSite(site) {
  if (!site) return "#";

  if (site.startsWith("http://") || site.startsWith("https://")) {
    return site;
  }

  return "https://" + site;
}

function copiarTexto(texto) {
  if (!texto || texto === "não encontrado") {
    alert("Telefone não encontrado.");
    return;
  }

  navigator.clipboard.writeText(texto);
  alert("Copiado!");
}

function limparTexto(texto) {
  return String(texto || "").replace(/'/g, "").replace(/"/g, "");
}
</script>

</body>
</html>
