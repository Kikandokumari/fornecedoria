<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FornecedorIA</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f5f7;
  margin:0;
  padding:20px;
  color:#111;
}

.container{
  max-width:720px;
  margin:auto;
  background:white;
  padding:24px;
  border-radius:14px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  margin-bottom:8px;
}

p{
  text-align:center;
  color:#555;
}

input{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  margin-top:16px;
  background:#16a34a;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
}

#resultado{
  margin-top:22px;
  padding:18px;
  background:#f0fdf4;
  border-radius:10px;
  white-space:pre-wrap;
  display:none;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="container">
  <h1>FornecedorIA</h1>
  <p>Encontre fornecedores para seu negócio usando IA.</p>

  <input id="produto" placeholder="Ex: fornecedor de bebidas">
  <input id="cidade" placeholder="Ex: Uberlândia">

  <button onclick="buscar()">Buscar fornecedores</button>

  <div id="resultado"></div>
</div>

<script>
async function buscar() {
  const produto = document.getElementById("produto").value.trim();
  const cidade = document.getElementById("cidade").value.trim();
  const resultado = document.getElementById("resultado");

  if (!produto || !cidade) {
    alert("Preencha o produto e a cidade.");
    return;
  }

  resultado.style.display = "block";
  resultado.innerText = "Pesquisando fornecedores com IA...";

  try {
    const resposta = await fetch("/api/buscar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        busca: `${produto} em ${cidade}`
      })
    });

    const dados = await resposta.json();

    resultado.innerText = dados.resultado || dados.erro || "Nenhum resultado encontrado.";

  } catch (erro) {
    resultado.innerText = "Erro ao buscar fornecedores. Tente novamente.";
  }
}
</script>

</body>
</html>
