<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FornecedorIA</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  margin: 0;
  padding: 20px;
  color: #111;
}

.container {
  max-width: 760px;
  margin: auto;
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  margin-bottom: 8px;
  font-size: 38px;
}

.subtitulo {
  text-align: center;
  color: #555;
  font-size: 18px;
  margin-bottom: 28px;
}

input {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 16px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #15803d;
}

#resultado {
  margin-top: 24px;
}

.card {
  background: #f0fdf4;
  border: 1px solid #d1fae5;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 16px;
}

.card h2 {
  margin: 0 0 12px;
  font-size: 22px;
}

.info {
  margin: 8px 0;
  font-size: 16px;
  line-height: 1.4;
}

.info strong {
  color: #111;
}

.acoes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}

.btn {
  display: block;
  text-align: center;
  padding: 12px;
  border-radius: 9px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;
}

.btn-whatsapp {
  background: #16a34a;
  color: white;
}

.btn-site {
  background: #111827;
  color: white;
}

.btn-copiar {
  background: #e5e7eb;
  color: #111;
  border: none;
}

.comparador {
  margin-top: 28px;
  padding: 18px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 14px;
  display: none;
}

.comparador h2 {
  margin-top: 0;
}

.tabela {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 14px;
}

.tabela th,
.tabela td {
  border: 1px solid #ddd;
  padding: 8px;
  text-align: left;
}

.tabela th {
  background: #f3f4f6;
}

.aviso {
  margin-top: 18px;
  color: #666;
  font-size: 13px;
  text-align: center;
}

.loading {
  background: #f0fdf4;
  padding: 18px;
  border-radius: 12px;
  font-size: 18px;
}

.erro {
  background: #fee2e2;
  color: #991b1b;
  padding: 18px;
  border-radius: 12px;
}

@media (max-width: 600px) {
  body {
    padding: 14px;
  }

  .container {
    padding: 20px;
  }

  h1 {
    font-size: 34px;
  }

  .acoes {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>FornecedorIA</h1>
  <p class="subtitulo">Encontre fornecedores para seu negócio usando IA.</p>

  <input id="produto" placeholder="Ex: fornecedor de bebidas">
  <input id="cidade" placeholder="Ex: Uberlândia">

  <button onclick="buscar()">Buscar fornecedores</button>

  <div id="resultado"></div>

  <div id="comparador" class="comparador">
    <h2>Comparar valores e benefícios</h2>
    <p>Use esta tabela para comparar os fornecedores antes de chamar.</p>
    <table class="tabela">
      <thead>
        <tr>
          <th>Empresa</th>
          <th>Produtos</th>
          <th>Benefícios</th>
          <th>Faixa de preço</th>
        </tr>
      </thead>
      <tbody id="tabelaComparacao"></tbody>
    </table>
  </div>

  <p class="aviso">
    Confirme preços, disponibilidade e entrega diretamente com o fornecedor.
  </p>
</div>

<script>
let fornecedoresAtuais = [];

async function buscar() {
  const produto = document.getElementById("produto").value.trim();
  const cidade = document.getElementById("cidade").value.trim();
  const resultado = document.getElementById("resultado");
  const comparador = document.getElementById("comparador");

  if (!produto || !cidade) {
    alert("Preencha o produto e a cidade.");
    return;
  }

  resultado.innerHTML = `<div class="loading">Pesquisando fornecedores...</div>`;
  comparador.style.display = "none";
  fornecedoresAtuais = [];

  try {
    const resposta = await fetch("/api/buscar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        busca: `${produto} em ${cidade}`
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      resultado.innerHTML = `<div class="erro">${dados.erro || "Erro ao buscar fornecedores."}</div>`;
      return;
    }

    fornecedoresAtuais = dados.fornecedores || [];

    if (!fornecedoresAtuais.length) {
      resultado.innerHTML = `<div class="erro">Nenhum fornecedor encontrado.</div>`;
      return;
    }

    mostrarFornecedores(fornecedoresAtuais);
    montarComparador(fornecedoresAtuais);

  } catch (erro) {
    resultado.innerHTML = `<div class="erro">Erro ao buscar fornecedores. Tente novamente.</div>`;
  }
}

function mostrarFornecedores(lista) {
  const resultado = document.getElementById("resultado");
  resultado.innerHTML = "";

  lista.forEach((f, index) => {
    const temWhatsapp = f.whatsappLink && f.whatsapp !== "não encontrado";
    const siteValido = f.site && f.site !== "não encontrado";

    const whatsappUrl = temWhatsapp
      ? `https://wa.me/${f.whatsappLink}?text=${encodeURIComponent("Olá, encontrei sua empresa pelo FornecedorIA. Gostaria de saber valores, benefícios e condições de fornecimento.")}`
      : "";

    const siteUrl = siteValido
      ? normalizarSite(f.site)
      : "";

    resultado.innerHTML += `
      <div class="card">
        <h2>${f.empresa || "Empresa não encontrada"}</h2>

        <p class="info"><strong>Cidade:</strong> ${f.cidade || "não encontrado"}</p>
        <p class="info"><strong>Telefone:</strong> ${f.telefone || "não encontrado"}</p>
        <p class="info"><strong>WhatsApp:</strong> ${f.whatsapp || "não encontrado"}</p>
        <p class="info"><strong>Site:</strong> ${f.site || "não encontrado"}</p>
        <p class="info"><strong>Produtos:</strong> ${f.produtos || "não encontrado"}</p>
        <p class="info"><strong>Benefícios:</strong> ${f.beneficios || "consultar fornecedor"}</p>
        <p class="info"><strong>Faixa de preço:</strong> ${f.faixaPreco || "consultar fornecedor"}</p>

        <div class="acoes">
          ${
            temWhatsapp
              ? `<a class="btn btn-whatsapp" href="${whatsappUrl}" target="_blank">Chamar no WhatsApp</a>`
              : `<button class="btn btn-copiar" onclick="copiarTexto('${limparAspas(f.telefone)}')">Copiar telefone</button>`
          }

          ${
            siteValido
              ? `<a class="btn btn-site" href="${siteUrl}" target="_blank">Abrir site</a>`
              : `<button class="btn btn-copiar" onclick="copiarTexto('${limparAspas(f.empresa)}')">Copiar empresa</button>`
          }
        </div>
      </div>
    `;
  });
}

function montarComparador(lista) {
  const comparador = document.getElementById("comparador");
  const tabela = document.getElementById("tabelaComparacao");

  tabela.innerHTML = "";

  lista.forEach(f => {
    tabela.innerHTML += `
      <tr>
        <td>${f.empresa || "não encontrado"}</td>
        <td>${f.produtos || "não encontrado"}</td>
        <td>${f.beneficios || "consultar fornecedor"}</td>
        <td>${f.faixaPreco || "consultar fornecedor"}</td>
      </tr>
    `;
  });

  comparador.style.display = "block";
}

function normalizarSite(site) {
  if (!site) return "#";

  if (site.startsWith("http://") || site.startsWith("https://")) {
    return site;
  }

  return "https://" + site;
}

function copiarTexto(texto) {
  navigator.clipboard.writeText(texto);
  alert("Copiado!");
}

function limparAspas(texto) {
  return String(texto || "").replace(/'/g, "").replace(/"/g, "");
}
</script>

</body>
</html>
